[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Netlify Forms picks up the hidden static form in cta / newsletter markup.
# No redirects needed for a single-page + stub-pages layout, but pretty URLs
# are preserved by Eleventy's directory-index output (e.g. /about/index.html).

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
